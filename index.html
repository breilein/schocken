<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#6278dc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Schocken – Deckelzähler</title>
<style>
:root{--blue:#6278dc;--violet:#704799;--green:#40a94d;--red:#ef4242;--orange:#ff9700}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:#6278dc}
body{margin:0;min-height:100vh;padding:12px 9px 26px;padding-bottom:max(26px,env(safe-area-inset-bottom));background:linear-gradient(145deg,#687ce2,#71469a);font-family:Arial,sans-serif;color:#292929;-webkit-text-size-adjust:100%}
.app{width:min(100%,520px);margin:auto}h1{margin:3px 0 4px;text-align:center;color:#fff;font-size:32px}.subtitle{margin:0 0 13px;text-align:center;color:#fff;font-size:15px;font-weight:700}
.row{display:flex;gap:10px}.card,.middle,.score,.message{background:#fff;border-radius:20px;box-shadow:0 7px 18px #0003}.card{width:50%;padding:15px 7px 17px;text-align:center}.name{font-size:21px;font-weight:800}.count{margin:8px 0 11px;color:var(--blue);font-size:56px;line-height:1;font-weight:900}.controls{display:flex;justify-content:center;gap:12px}
button{font:800 16px Arial,sans-serif;border:0;cursor:pointer;touch-action:manipulation;user-select:none}button:active{transform:scale(.96)}button:disabled{opacity:.25;transform:none}.round{width:76px;height:64px;border-radius:17px;color:#fff;font-size:40px}.plus{background:var(--green)}.minus{background:var(--red)}
.middle{margin-top:12px;padding:16px 10px;text-align:center}.middle-title{font-size:18px;font-weight:800;color:#555}.middle-count{margin:3px 0 13px;color:var(--violet);font-size:62px;line-height:1;font-weight:900}.assign{width:calc(50% - 8px);min-height:82px;margin:0 3px;border:3px solid #896c46;border-radius:18px;background:#d5a878;color:#4e3b28;font-size:17px}
.message{margin:12px 0;padding:13px 11px;text-align:center;font-size:15px;line-height:1.35;font-weight:600}.actions{display:flex;gap:10px}.action{flex:1;min-height:60px;border-radius:14px;color:#fff;font-size:16px;box-shadow:0 4px 10px #0003}.new{background:var(--orange)}.reset{background:#737373}
.score{margin-top:12px;padding:15px 11px;text-align:center}.score h2{margin:0 0 4px;font-size:20px}.score-note{font-size:12px;color:#666;margin-bottom:10px}.scores{display:flex;gap:10px}.scorebox{width:50%;padding:9px;border-radius:13px;background:#f1f1f1;font-weight:800;font-size:16px}.scorebox span{display:block;margin-top:2px;color:var(--violet);font-size:42px;line-height:1.1}.points-reset{margin-top:12px;min-height:50px;padding:10px 18px;border-radius:11px;background:#777;color:#fff;font-size:15px}.footer{margin:13px 0 5px;text-align:center;color:#fff;font-size:14px}
@media(max-width:370px){h1{font-size:29px}.name{font-size:19px}.count{font-size:49px}.round{width:68px;height:60px}.assign{font-size:15px;min-height:74px}}
</style>
</head>
<body>
<main class="app">
<h1>Schocken</h1>
<p id="phase" class="subtitle">Phase 1: Deckel werden aus der Mitte verteilt.</p>
<section class="row">
<div class="card"><div class="name">Nessi</div><div id="nCount" class="count">0</div><div class="controls"><button id="nMinus" class="round minus" type="button" aria-label="Nessi gibt einen Deckel ab">−</button><button id="nPlus" class="round plus" type="button" aria-label="Deckel zu Nessi">+</button></div></div>
<div class="card"><div class="name">Marc</div><div id="mCount" class="count">0</div><div class="controls"><button id="mMinus" class="round minus" type="button" aria-label="Marc gibt einen Deckel ab">−</button><button id="mPlus" class="round plus" type="button" aria-label="Deckel zu Marc">+</button></div></div>
</section>
<section class="middle"><div class="middle-title">DECKEL IN DER MITTE</div><div id="cCount" class="middle-count">13</div><button id="toNessi" class="assign" type="button">1 Deckel<br>→ Nessi</button><button id="toMarc" class="assign" type="button">1 Deckel<br>→ Marc</button></section>
<div id="message" class="message">Tippe für jeden fälligen Deckel auf Nessi oder Marc.</div>
<section class="actions"><button id="newRound" class="action new" type="button">Neue Runde</button><button id="allMiddle" class="action reset" type="button">Alles in die Mitte</button></section>
<section class="score"><h2>Verlorene Hälften</h2><div class="score-note">Der Zähler läuft dauerhaft weiter und wird nur mit „Zähler auf 0“ gelöscht.</div><div class="scores"><div class="scorebox">Nessi<span id="nWins">0</span></div><div class="scorebox">Marc<span id="mWins">0</span></div></div><button id="resetPoints" class="points-reset" type="button">Zähler auf 0</button></section>
<div class="footer">Insgesamt: 13 Deckel</div>
</main>
<script>
(function(){'use strict';
var TOTAL=13,KEY='schocken-score-v7';
var state={nessi:0,marc:0,center:13,nessiLost:'0',marcLost:'0',half:1,firstLoser:''};
function $(id){return document.getElementById(id)}
function nonNeg(v,d){var n=Number(v);return Number.isFinite(n)&&n>=0?Math.floor(n):d}
function big(v){try{var s=String(v);if(!/^\d+$/.test(s))return BigInt(0);return BigInt(s)}catch(e){return BigInt(0)}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(x){state.nessi=nonNeg(x.nessi,0);state.marc=nonNeg(x.marc,0);state.center=nonNeg(x.center,TOTAL);state.nessiLost=String(x.nessiLost??x.nWins??'0');state.marcLost=String(x.marcLost??x.mWins??'0');state.half=nonNeg(x.half,1);state.firstLoser=typeof x.firstLoser==='string'?x.firstLoser:''}}catch(e){}normalize()}
function normalize(){if(state.nessi+state.marc+state.center!==TOTAL||state.center<0||state.nessi<0||state.marc<0){state.nessi=0;state.marc=0;state.center=TOTAL}if(!/^\d+$/.test(state.nessiLost))state.nessiLost='0';if(!/^\d+$/.test(state.marcLost))state.marcLost='0';if(state.half<1||state.half>3)state.half=1}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function render(){
$('nCount').textContent=state.nessi;$('mCount').textContent=state.marc;$('cCount').textContent=state.center;
$('nWins').textContent=state.nessiLost;$('mWins').textContent=state.marcLost;
var middle=state.center>0;$('toNessi').disabled=!middle;$('toMarc').disabled=!middle;$('nPlus').disabled=!middle;$('mPlus').disabled=!middle;$('nMinus').disabled=middle||state.nessi===0;$('mMinus').disabled=middle||state.marc===0;
$('phase').textContent=middle?'Deckel verteilen · Hälfte '+state.half:'Deckel verschieben · Hälfte '+state.half;
$('message').textContent=middle?'Nach dem echten Würfeln: für jeden fälligen Deckel den Empfänger antippen.':'Mitte leer: Der Gewinner gibt Deckel ab. Rote − Taste beim abgebenden Spieler.'}
function fromCenter(p){if(state.center<1)return;state.center--;state[p]++;save();render();check13(p)}
function move(p){if(state.center!==0||state[p]<1)return;var q=p==='nessi'?'marc':'nessi';state[p]--;state[q]++;save();render();check13(q)}
function incLost(p){var k=p==='nessi'?'nessiLost':'marcLost';state[k]= (big(state[k])+1n).toString()}
function check13(p){if(state[p]!==TOTAL)return;incLost(p);save();setTimeout(function(){
 var loser=p==='nessi'?'Nessi':'Marc';
 if(state.half===1){state.firstLoser=p;state.half=2;resetDeckels();save();render();alert(loser+' hat die 1. Hälfte verloren.\nDie 2. Hälfte beginnt.');}
 else if(state.half===2){var second=p;if(second===state.firstLoser){resetDeckels();state.half=1;state.firstLoser='';save();render();alert(loser+' hat beide Hälften verloren.\nDas Spiel ist beendet.');}else{state.half=3;resetDeckels();save();render();alert('Die beiden Hälften haben unterschiedliche Verlierer.\nDas Finale beginnt.');}}
 else{resetDeckels();state.half=1;state.firstLoser='';save();render();alert(loser+' hat das Finale verloren.\nDas Spiel ist beendet.');}
},60)}
function resetDeckels(){state.nessi=0;state.marc=0;state.center=TOTAL}
function newRound(){resetDeckels();state.half=1;state.firstLoser='';save();render()}
function resetCounter(){state.nessiLost='0';state.marcLost='0';save();render()}
function bind(id,fn){var e=$(id);if(e)e.addEventListener('click',fn,false)}
bind('toNessi',function(){fromCenter('nessi')});bind('toMarc',function(){fromCenter('marc')});bind('nPlus',function(){fromCenter('nessi')});bind('mPlus',function(){fromCenter('marc')});bind('nMinus',function(){move('nessi')});bind('mMinus',function(){move('marc')});bind('newRound',newRound);bind('allMiddle',newRound);bind('resetPoints',resetCounter);
load();render();
})();
</script>
</body></html>
